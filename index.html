
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trang bí mật 💗</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffd6e7, #e7d6ff);
      overflow: hidden;
    }

    .page {
      position: absolute;
      width: 90%;
      max-width: 400px;
      padding: 35px 25px;
      text-align: center;
      background: white;
      border-radius: 25px;
      box-shadow: 0 10px 35px #b47aa544;
      transition: opacity 0.7s ease, transform 0.7s ease;
    }

    .hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateY(30px) scale(0.95);
    }

    h1 {
      color: #e75491;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 2px solid #ffc0d9;
      border-radius: 12px;
      outline: none;
      font-size: 16px;
      text-align: center;
      margin: 15px 0;
    }

    button {
      padding: 13px 25px;
      border: none;
      border-radius: 25px;
      color: white;
      background: #ec72a7;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #d94d8b;
      transform: scale(1.05);
    }

    #message {
      color: #e04474;
      min-height: 20px;
    }

    .heart {
      font-size: 60px;
      animation: beat 1s infinite;
    }

    @keyframes beat {
      50% { transform: scale(1.2); }
    }

    #page2 {
      max-width: 500px;
    }
  </style>
</head>

<body>

  <!-- CẢNH 1: NHẬP MẬT MÃ -->
  <div class="page" id="page1">
    <div class="heart">💗</div>
    <h1>Chào bạn!</h1>
    <p>Hãy nhập mật mã để mở cánh cửa bí mật nhé ✨</p>

    <input
      type="password"
      id="password"
      placeholder="Nhập mật mã..."
    >

    <br>

    <button onclick="checkPassword()">
      Mở bí mật 💌
    </button>

    <p id="message"></p>
  </div>

  <!-- CẢNH 2: NỘI DUNG SAU KHI NHẬP ĐÚNG -->
  <div class="page hidden" id="page2">
    <div class="heart">💖</div>
    <h1>Bạn đã mở được rồi!</h1>
    <p>Chúc mừng bạn đã nhập đúng mật mã.</p>
    <p>Chào mừng đến với thế giới bí mật của mình! 🌷</p>
  </div>

  <script>
    // Đổi mật mã tại đây
    const correctPassword = "123456";

    function checkPassword() {
      const password =
        document.getElementById("password").value;

      const message =
        document.getElementById("message");

      if (password === correctPassword) {
        message.textContent = "Chính xác! 💗";

        // Chờ một chút rồi chuyển cảnh
        setTimeout(() => {
          document.getElementById("page1")
            .classList.add("hidden");

          document.getElementById("page2")
            .classList.remove("hidden");
        }, 500);

      } else {
        message.textContent =
          "Mật mã chưa đúng, thử lại nhé! 💔";
      }
    }

    // Cho phép nhấn Enter để xác nhận
    document.getElementById("password")
      .addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
          checkPassword();
        }
      });
  </script>

</body>
</html>
